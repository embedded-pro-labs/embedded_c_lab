name: Embedded C Unit Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up GCC and Make
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential

    - name: Build and Run Module 1 (Arrays & Strings) Tests
      run: |
        cd 01_arrays_strings
        make
